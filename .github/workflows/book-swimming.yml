name: Book Swimming Slot

on:
  schedule:
    # 11:00 PM UTC Sunday-Thursday
    # = ~4:30 AM IST Monday-Friday
    - cron: "0 23 * * 0-4"

  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t swimming-booker .

      - name: Run booking script
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          docker run --rm \
            -e LOGIN_EMAIL="$LOGIN_EMAIL" \
            -e LOGIN_PASSWORD="$LOGIN_PASSWORD" \
            -e SENDER_EMAIL="$SENDER_EMAIL" \
            -e SENDER_APP_PASSWORD="$SENDER_APP_PASSWORD" \
            -e RECEIVER_EMAIL="$RECEIVER_EMAIL" \
            swimming-booker

      - name: Copy screenshots from container
        if: always()
        run: |
          docker run --name swimming-debug \
            -e LOGIN_EMAIL="${{ secrets.LOGIN_EMAIL }}" \
            -e LOGIN_PASSWORD="${{ secrets.LOGIN_PASSWORD }}" \
            -e SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}" \
            -e SENDER_APP_PASSWORD="${{ secrets.SENDER_APP_PASSWORD }}" \
            -e RECEIVER_EMAIL="${{ secrets.RECEIVER_EMAIL }}" \
            swimming-booker || true

          docker cp swimming-debug:/app/. ./screenshots/ 2>/dev/null || true
          docker rm swimming-debug || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: "**/*.png"
          if-no-files-found: ignore
